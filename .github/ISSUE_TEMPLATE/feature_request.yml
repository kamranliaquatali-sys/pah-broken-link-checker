name: Feature request
description: Suggest a practical improvement to PAH Broken Link Checker
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow problem or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain the feature and how it should work.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Who would benefit?
      description: Explain how this helps site owners, developers, or SEO professionals.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or alternative approaches.
